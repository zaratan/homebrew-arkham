name: Bump casks

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump outdated casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
        run: |
          brew livecheck --tap zaratan/arkham --cask --newer-only --json \
            | jq -r '.[] | [.cask, .version.latest] | @tsv' \
            | while IFS=$'\t' read -r name version; do
                echo "::group::Bumping $name to $version"
                brew bump-cask-pr --no-browse --no-fork --version="$version" "zaratan/arkham/$name" || true
                echo "::endgroup::"
              done
