name: CI

on:
  push:
    # bump-* covers the automated cask bumps: their PR is opened by
    # github-actions[bot], and a PR opened by GITHUB_TOKEN does not trigger
    # `pull_request` workflows, so CI runs off the branch push instead.
    branches: [main, 'bump-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: brew style
        run: brew style zaratan/arkham

      - name: brew audit
        run: brew audit --cask --tap zaratan/arkham
